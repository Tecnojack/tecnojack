<!doctype html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="utf-8">
    <title>TECNOJACK — El arte de ser un pro.</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="color-scheme" content="dark light">
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('tj_theme_v2');
                var theme = savedTheme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;

                var savedLang = localStorage.getItem('tj_language_pref');
                if (savedLang === 'en' || savedLang === 'es') {
                    document.documentElement.setAttribute('lang', savedLang);
                }
            } catch(e) {}
        })();
    </script>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>

<body>
    <app-root></app-root>
</body>

</html>
