<tj-portfolio-shell [navItems]="navItems" brandHref="/portfolio" [subtitle]="''" [floatWaHref]="floatWaHref" [editable]="editable">
  <div class="portfolio-story" tjCinematicMotion>
    <!-- Scroll progress (motion layer only) -->
    <div class="portfolio-story__progress" aria-hidden="true"><span data-scroll-progress></span></div>

    <!-- Scene 01: Shutter-opening hero (3D iris opens on load, reveals the photograph) -->
    <tj-hero-section [editable]="editable" />

    <!-- Scene 02: Services film strip — every card leads to its own service page -->
    <tj-services-reel-section />

    <!-- Scene 03: Creator teaser — manifesto + one link to "Sobre mí" -->
    <tj-home-about-teaser-section />

    <!-- Scene 04: Contact invitation -->
    <tj-contact-section [editable]="editable" />
  </div>
</tj-portfolio-shell>
