<section class="portfolio-section contact-section" id="contact">
    <div class="contact-section__minimal" tjRevealOnScroll>
        <div class="contact-section__info">
            <h2 class="heading-md">{{ title }}</h2>
            <p class="text-body text-muted">{{ lead }}</p>
        </div>
        <div class="contact-section__actions">
            <div class="contact-section__social-icons">
                <a class="social-icon-btn" *ngFor="let item of getSocialLinks()" [href]="item.href" target="_blank" rel="noopener" [title]="item.title">
                    <fa-icon [icon]="icons[item.platform]"></fa-icon>
                </a>
            </div>
            <a class="contact-section__btn-wa btn-text" [href]="whatsappHref" target="_blank" rel="noopener">
                Hablar por WhatsApp
            </a>
        </div>
    </div>
</section>
