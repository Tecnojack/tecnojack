<section class="portfolio-section services-section" id="services">
    <div class="services-container" tjRevealOnScroll>
        <div class="services-head">
            <span class="services-badge">CATÁLOGO DE SERVICIOS</span>
            <h2 class="heading-lg services-title">Propuestas &amp; Coberturas Audiovisuales</h2>
            <p class="text-body text-muted services-lead">
                Soluciones integrales de fotografía, cinematografía y desarrollo visual diseñadas para cada tipo de proyecto.
            </p>
        </div>

        <div class="services-grid">
            <article class="service-card" *ngFor="let service of services; let index = index" tjRevealOnScroll>
                <div class="service-card__media" *ngIf="service.image">
                    <img [src]="service.image" [alt]="service.title" loading="lazy" />
                    <div class="service-card__badge">0{{ index + 1 }}</div>
                </div>

                <div class="service-card__body">
                    <h3 class="service-card__title">{{ service.title }}</h3>
                    <p class="service-card__desc">{{ service.description }}</p>

                    <ul class="service-card__points" *ngIf="service.points?.length">
                        <li *ngFor="let point of service.points">✓ {{ point }}</li>
                    </ul>

                    <a class="service-card__btn" [href]="service.href">
                        {{ service.ctaLabel || 'Ver Paquetes' }} &rarr;
                    </a>
                </div>
            </article>
        </div>
    </div>
</section>
