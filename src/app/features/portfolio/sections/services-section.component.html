<section class="portfolio-section services-section" id="services">
    <div class="services-minimal-container" tjRevealOnScroll>
        <div class="services-minimal-head">
            <p class="eyebrow">{{ heading.eyebrow }}</p>
            <h2 class="heading-lg">{{ heading.title }}</h2>
            <span class="text-body text-muted">{{ services.length }} propuestas activas</span>
        </div>

        <div class="services-minimal-list">
            <article class="service-row" *ngFor="let service of services; let index = index" tjRevealOnScroll>
                <div class="service-row__meta">
                    <span class="service-row__num">{{ index + 1 < 10 ? '0' + (index + 1) : index + 1 }}</span>
                </div>
                <div class="service-row__content">
                    <h3 class="heading-md">{{ service.title }}</h3>
                    <p class="text-body text-muted">{{ service.description }}</p>
                </div>
                <div class="service-row__action">
                    <a class="service-row__cta btn-text" [href]="service.href">
                        {{ service.ctaLabel || 'Ver paquetes' }} &rarr;
                    </a>
                </div>
            </article>
        </div>
    </div>
</section>
