<section class="tj-erp-page"><header class="tj-erp-page__header"><h1 class="tj-erp-page__title">Entregables</h1><button class="tj-erp-btn tj-erp-btn--primary"><fa-icon [icon]="icons.plus"></fa-icon>Añadir</button></header><div class="tj-erp-stats-grid"><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Total</span><strong class="tj-erp-stat-card__value">5</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Entregados</span><strong class="tj-erp-stat-card__value">2</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">En progreso</span><strong class="tj-erp-stat-card__value">1</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Pendientes</span><strong class="tj-erp-stat-card__value">2</strong></article></div><div class="tj-erp-table-wrapper"><table class="tj-erp-table"><thead><tr><th>Entregable</th><th>Cliente</th><th>Tipo</th><th>Responsable</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let item of deliverables()"><td><strong>{{ item.name }}</strong></td><td>{{ item.client }}</td><td><span class="stage-tag">{{ item.type }}</span></td><td>{{ item.owner }}</td><td>{{ item.dueDate }}</td><td><span class="delivery-state" [class.delivery-state--done]="item.status === 'Entregado'" [class.delivery-state--progress]="item.status === 'En progreso'">{{ item.status }}</span></td><td><button class="icon-action">✓</button></td></tr></tbody></table></div></section>
