<section class="tj-erp-page"><header class="tj-erp-page__header"><h1 class="tj-erp-page__title">Invitaciones Digitales</h1><button class="tj-erp-btn tj-erp-btn--primary"><fa-icon [icon]="icons.plus"></fa-icon>Crear Invitación</button></header><div class="inv-grid"><article class="inv-card" *ngFor="let item of invitations()"><div class="inv-preview"><span class="inv-status" [class.draft]="item.status === 'Borrador'">{{ item.status }}</span><strong>{{ item.status === 'Publicada' ? 'BODA' : 'XV' }}</strong><small>✦ {{ item.couple }} ✦</small></div><h2>{{ item.title }}</h2><div class="inv-stats" *ngIf="item.status === 'Publicada'"><div><strong>{{ item.sent }}</strong><small>Enviadas</small></div><div class="success"><strong>{{ item.confirmed }}</strong><small>Confirmadas</small></div><div class="warning"><strong>{{ item.pending }}</strong><small>Pendientes</small></div><div class="danger"><strong>{{ item.declined }}</strong><small>Declinadas</small></div></div><div class="inv-actions"><button class="tj-erp-btn tj-erp-btn--primary">Editar</button><button class="tj-erp-btn tj-erp-btn--secondary">RSVP</button><button class="tj-erp-btn tj-erp-btn--secondary">Compartir</button></div></article></div></section>
