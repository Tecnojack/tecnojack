<section class="tj-erp-page">
  <header class="tj-erp-page__header"><h1 class="tj-erp-page__title">Contratos</h1><div class="tj-erp-page__actions"><button class="tj-erp-btn tj-erp-btn--primary"><fa-icon [icon]="icons.plus"></fa-icon>Nuevo Contrato</button></div></header>
  <div class="tj-erp-stats-grid"><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Total</span><strong class="tj-erp-stat-card__value">{{ contracts().length }}</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Firmados</span><strong class="tj-erp-stat-card__value">2</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Pendientes</span><strong class="tj-erp-stat-card__value">1</strong></article><article class="tj-erp-stat-card"><span class="tj-erp-stat-card__label">Valor contratado</span><strong class="tj-erp-stat-card__value">$27,7M</strong></article></div>
  <div class="tj-erp-table-wrapper"><table class="tj-erp-table"><thead><tr><th>Contrato</th><th>Cliente</th><th>Evento</th><th>Valor</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let c of contracts()"><td><strong>{{ c.type }}</strong><small class="row-subtitle">{{ c.code }}</small></td><td>{{ c.client }}</td><td>{{ c.event }}</td><td class="value-gold">$ {{ c.value | number:'1.0-0' }}</td><td><span class="contract-chip" [class.signed]="c.status === 'signed'">{{ c.status === 'signed' ? 'Firmado' : 'Pendiente firma' }}</span></td><td>{{ c.signedAt }}</td><td><button class="icon-action" aria-label="Descargar contrato"><fa-icon [icon]="icons.download"></fa-icon></button></td></tr></tbody></table></div>
</section>
