<section class="tj-erp-page"><header class="tj-erp-page__header"><h1 class="tj-erp-page__title">Media Library</h1><div class="tj-erp-page__actions"><button class="view-button view-button--active">▦</button><button class="view-button">☷</button><button class="tj-erp-btn tj-erp-btn--primary"><fa-icon [icon]="icons.upload"></fa-icon>Subir Archivos</button></div></header><div class="tj-erp-filter-bar"><div class="tj-erp-filter-bar__search"><fa-icon [icon]="icons.search"></fa-icon><input placeholder="Buscar archivos..." /></div><div class="tj-erp-filter-bar__pills"><button class="tj-erp-pill" *ngFor="let item of ['todos','foto','video','entrega','proyecto']" [class.tj-erp-pill--active]="filter() === item" (click)="filter.set(item)">{{ item | titlecase }}</button></div></div><div class="media-grid"><article class="media-item" *ngFor="let file of files()"><div class="media-item__preview"><fa-icon [icon]="file.type === 'video' ? icons.video : file.type === 'foto' ? icons.image : icons.folder"></fa-icon></div><strong>{{ file.name }}</strong><small>{{ file.size }}</small><span [class.processed]="file.status === 'procesado'">{{ file.status }}</span></article><button class="media-upload"><fa-icon [icon]="icons.upload"></fa-icon><span>Subir archivos</span></button></div></section>
