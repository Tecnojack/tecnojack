<section class="settings-page"><h1>Configuración</h1><div class="settings-layout"><nav><button [class.active]="activeTab() === 'company'" (click)="activeTab.set('company')">Empresa</button><button [class.active]="activeTab() === 'billing'" (click)="activeTab.set('billing')">Facturación</button><button [class.active]="activeTab() === 'notifications'" (click)="activeTab.set('notifications')">Notificaciones</button><button [class.active]="activeTab() === 'integrations'" (click)="activeTab.set('integrations')">Integraciones</button><button [class.active]="activeTab() === 'security'" (click)="activeTab.set('security')">Seguridad</button></nav><article class="settings-card"><ng-container *ngIf="activeTab() === 'company'"><h2>Información de la Empresa</h2><label>Nombre<input [ngModel]="studioName()" (ngModelChange)="studioName.set($event)"></label><label>NIT<input value="901.234.567-8"></label><div class="form-cols"><label>Email<input value="info@tecnojack.co"></label><label>Teléfono<input value="+57 (604) 444 5678"></label></div><label>Dirección<input value="El Poblado, Medellín"></label></ng-container><ng-container *ngIf="activeTab() === 'billing'"><h2>Facturación</h2><label>Moneda<select><option>COP — Peso Colombiano</option><option>USD</option></select></label><label>Pasarela<select><option>Wompi</option><option>PSE</option></select></label></ng-container><ng-container *ngIf="activeTab() === 'notifications'"><h2>Notificaciones</h2><div class="setting-row" *ngFor="let item of ['Pago recibido','Pago vencido','Contrato firmado','Evento próximo (48h)','Nueva oportunidad']"><span>{{ item }}</span><label><input type="checkbox" checked>Email</label><label><input type="checkbox" checked>Push</label></div></ng-container><ng-container *ngIf="activeTab() === 'integrations'"><h2>Integraciones</h2><div class="integration" *ngFor="let item of ['Google Calendar','WhatsApp Business','Slack','Dropbox','Google Drive','Zapier']"><span>{{ item }}</span><button>Conectar</button></div></ng-container><ng-container *ngIf="activeTab() === 'security'"><h2>Seguridad</h2><label>Contraseña actual<input type="password"></label><label>Nueva contraseña<input type="password"></label><label>Confirmar<input type="password"></label><div class="integration"><span>Autenticación 2 factores<small>Desactivada</small></span><button>Activar 2FA</button></div></ng-container><button class="save"><fa-icon [icon]="icons.save"></fa-icon>Guardar cambios</button></article></div></section>
